name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap_existing_db:
        description: 'First deployment only: back up and adopt the existing database into Flyway'
        type: boolean
        default: false

permissions:
  contents: read

# Never interrupt an in-progress database backup or container replacement.
concurrency:
  group: health-center-production
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  images:
    name: Publish ARM64 images
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      backend: ${{ steps.references.outputs.backend }}
      frontend: ${{ steps.references.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject an outdated main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/require-current-main.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names
        id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          repository=$(printf '%s' "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          echo "backend=ghcr.io/$repository-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/$repository-frontend" >> "$GITHUB_OUTPUT"
      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/arm64
          push: true
          tags: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.healthq.store
            NEXT_PUBLIC_APP_URL=https://demo.healthq.store
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Pass immutable image references to deployment
        id: references
        env:
          BACKEND_NAME: ${{ steps.names.outputs.backend }}
          FRONTEND_NAME: ${{ steps.names.outputs.frontend }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        run: |
          echo "backend=$BACKEND_NAME@$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_NAME@$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy to Mac mini
    needs: images
    if: github.ref == 'refs/heads/main' && github.repository == 'yellow-pang/health-center-smart-reservation'
    runs-on: [self-hosted, macOS, ARM64, health-center-prod]
    environment:
      name: production
      url: https://demo.healthq.store
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_ROOT: /Users/tro/services/health-center
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare Mac tools and temporary registry credentials
        run: |
          echo /usr/local/bin >> "$GITHUB_PATH"
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          registry_config="$RUNNER_TEMP/health-center-docker-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$registry_config"
          chmod 700 "$registry_config"
          ln -s "$HOME/.docker/cli-plugins" "$registry_config/cli-plugins"
          echo "DOCKER_CONFIG=$registry_config" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix:///Users/tro/.orbstack/run/docker.sock" >> "$GITHUB_ENV"
          echo 'DOCKER_CONTEXT=' >> "$GITHUB_ENV"
      - name: Verify the production Docker engine and Compose plugin
        run: |
          test -S /Users/tro/.orbstack/run/docker.sock
          docker compose version
          case "$(docker info --format '{{.OSType}}/{{.Architecture}}')" in
            linux/aarch64|linux/arm64) ;;
            *) echo 'Expected the OrbStack Linux ARM64 engine.' >&2; exit 1 ;;
          esac
      - name: Reject an outdated main run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/require-current-main.py
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull, back up, deploy and verify
        env:
          RELEASE_SHA: ${{ github.sha }}
          BACKEND_IMAGE: ${{ needs.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ needs.images.outputs.frontend }}
          BOOTSTRAP_EXISTING_DB: ${{ inputs.bootstrap_existing_db && '1' || '0' }}
        run: bash scripts/deploy/deploy.sh
      - name: Remove temporary registry credentials
        if: always()
        run: |
          if [[ -n "${DOCKER_CONFIG:-}" && "$DOCKER_CONFIG" == "$RUNNER_TEMP"/health-center-docker-* ]]; then
            rm -f "$DOCKER_CONFIG/config.json"
          fi
