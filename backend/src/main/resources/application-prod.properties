# \uc6b4\uc601\uc11c\ubc84 \ud0c0\uc785(WINDOWS, UNIX)
Globals.OsType=LINUX

logging.rollingpolicy.maxHistory=90

# Production health checks expose only coarse status by default.
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:never}

# Never reset demo accounts or operational data when a production process starts.
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true
# Existing databases require an explicit, backed-up first adoption. Version 0 runs V1 too.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=0
Healthcenter.AccountRecovery.ExposeDevelopmentResetToken=false
