services:
  postgresql:
    image: pgvector/pgvector:0.8.2-pg18
    container_name: health-center-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-health_center}
      POSTGRES_USER: ${POSTGRES_USER:-health}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-health1234}
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
      PGTZ: ${DB_TIME_ZONE:-Asia/Seoul}
    command: ["postgres", "-c", "timezone=${DB_TIME_ZONE:-Asia/Seoul}"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - health-center-postgres-data:/var/lib/postgresql
    networks:
      - health-center-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: health-center-backend:local
    container_name: health-center-backend
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: ${DB_HOST:-postgresql}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-health_center}
      DB_USERNAME: ${DB_USERNAME:-health}
      DB_PASSWORD: ${DB_PASSWORD:-health1234}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-secret-at-least-32-bytes}
      JWT_ACCESS_EXPIRE: ${JWT_ACCESS_EXPIRE:-3600}
      JWT_REFRESH_EXPIRE: ${JWT_REFRESH_EXPIRE:-1209600}
      OAUTH_FRONTEND_CALLBACK_URL: ${OAUTH_FRONTEND_CALLBACK_URL:-http://localhost:3000/login/social/callback}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-http://localhost:8080/api/auth/social/kakao/callback}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      NAVER_REDIRECT_URI: ${NAVER_REDIRECT_URI:-http://localhost:8080/api/auth/social/naver/callback}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/social/google/callback}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-Asia/Seoul}
      DB_TIME_ZONE: ${DB_TIME_ZONE:-Asia/Seoul}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info,metrics,prometheus}
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: ${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:-never}
      MANAGEMENT_METRICS_TAGS_APPLICATION: ${MANAGEMENT_METRICS_TAGS_APPLICATION:-health-center-backend}
      INFO_APP_VERSION: ${INFO_APP_VERSION:-local}
      OBSERVABILITY_PROMETHEUS_SCRAPE_ENABLED: ${OBSERVABILITY_PROMETHEUS_SCRAPE_ENABLED:-false}
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Duser.timezone=Asia/Seoul}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - health-center-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    image: health-center-frontend:local
    container_name: health-center-frontend
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - health-center-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: health-center-prometheus
    profiles:
      - observability
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - health-center-prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - backend
    networks:
      - health-center-network
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    container_name: health-center-loki
    profiles:
      - observability
    command:
      - "-config.file=/etc/loki/loki-config.yml"
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - health-center-loki-data:/loki
    ports:
      - "${LOKI_PORT:-3100}:3100"
    networks:
      - health-center-network
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    container_name: health-center-promtail
    profiles:
      - observability
    command:
      - "-config.file=/etc/promtail/promtail-config.yml"
    volumes:
      - ./infra/observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - health-center-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: health-center-grafana
    profiles:
      - observability
    env_file:
      - .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      TZ: ${APP_TIME_ZONE:-Asia/Seoul}
    volumes:
      - ./infra/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - health-center-grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - health-center-network
    restart: unless-stopped

volumes:
  health-center-postgres-data:
  health-center-prometheus-data:
  health-center-loki-data:
  health-center-grafana-data:

networks:
  health-center-network:
    driver: bridge
