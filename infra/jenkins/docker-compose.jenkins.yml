services:
    jenkins:
        build:
            context: .
            dockerfile: Dockerfile
        image: health-center-jenkins:lts-jdk17-docker
        container_name: health-center-jenkins
        user: root
        ports:
            - "8081:8080"
            - "50000:50000"
        volumes:
            - jenkins-home:/var/jenkins_home
            - /var/run/docker.sock:/var/run/docker.sock
            - jenkins-maven-cache:/root/.m2
            - jenkins-npm-cache:/root/.npm
            - /apps/smart-drain:/deploy/smart-drain
        restart: unless-stopped

volumes:
    jenkins-home:
    jenkins-maven-cache:
    jenkins-npm-cache:
